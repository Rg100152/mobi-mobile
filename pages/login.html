<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your Mobi Mobile account." />
  <title>Login — Mobi Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Welcome Back</h1>
        <p>Log in to continue planning your next adventure.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <form class="form-wrap" id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Login</button>
          </div>

          <p class="form-note">
            New here? <a href="register.html">Create an account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
