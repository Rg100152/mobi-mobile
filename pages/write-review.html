<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Share your Mobi Mobile adventure and rate your experience." />
  <title>Write a Review — Mobi Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Write a Review</h1>
        <p>Tell the community about your latest trail or trip.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <form class="form-wrap" id="review-form" novalidate>
          <div class="form-field">
            <label for="review-name">Your Name</label>
            <input type="text" id="review-name" name="name" placeholder="e.g. Raj Gautam" required />
          </div>

          <div class="form-field">
            <label for="review-rating">Rating</label>
            <select id="review-rating" name="rating">
              <option value="5">5 — Excellent</option>
              <option value="4">4 — Very Good</option>
              <option value="3">3 — Good</option>
              <option value="2">2 — Fair</option>
              <option value="1">1 — Poor</option>
            </select>
          </div>

          <div class="form-field">
            <label for="review-comment">Your Review</label>
            <textarea id="review-comment" name="comment" placeholder="What did you love about the trail?" required></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">Submit Review</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
