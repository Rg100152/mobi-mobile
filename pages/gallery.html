<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photo gallery of trails and adventures from the Mobi Mobile community." />
  <title>Gallery — Mobi Mobile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1>Gallery</h1>
        <p>Real moments from real trails. Get inspired by the Mobi Mobile community.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="gallery-grid">
          <figure class="gallery-item gallery-item--wide">
            <img src="../images/hero.png" alt="Mountain trail at sunrise" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/hero1.png" alt="Hiker overlooking a valley" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/hero2.png" alt="Forest path in the mountains" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/hero3.png" alt="Rocky ridge line" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/hero4.png" alt="Lakeside camping spot" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted.png" alt="Community adventure moment" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-1.png" alt="Trail scenery from the community" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-2.png" alt="Sunset over the mountains" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-3.png" alt="Campfire gathering" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-4.png" alt="Climbing adventure" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-5.png" alt="Wide valley view" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-6.png" alt="Trail marker detail" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-7.png" alt="Waterfall on the trail" loading="lazy" />
          </figure>
          <figure class="gallery-item">
            <img src="../images/pasted-8.png" alt="Group of hikers on a summit" loading="lazy" />
          </figure>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
